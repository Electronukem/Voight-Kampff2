name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    name: attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Self-test the attribution check
        run: bash scripts/test-check-ai-attribution.sh

      - name: Scan commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="$BASE..$HEAD"
          elif [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..${{ github.sha }}"
          else
            range="${{ github.sha }} --not --remotes=origin/main^"
          fi
          echo "scanning: $range"
          # shellcheck disable=SC2086
          bash scripts/check-ai-attribution.sh --range $range

      # Passed as env, never interpolated into the shell: PR text is untrusted.
      - name: Scan pull request title and body
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/check-ai-attribution.sh --text

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell scripts are valid
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning scripts/*.sh .githooks/*

      - name: No large files committed
        run: |
          set -euo pipefail
          big="$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 5120 {print $1"KB\t"$2}')"
          if [ -n "$big" ]; then
            echo "::error::files over 5MB are tracked; evaluation artifacts belong outside git"
            echo "$big"
            exit 1
          fi
          echo "ok: no tracked file exceeds 5MB"

      # A module-level import added anywhere on the scenario/scoring import path
      # silently makes that package a hard dependency of the core. Local dev
      # environments have the extras installed and will not notice.
      - name: Core installs and imports without the optional extras
        run: |
          set -euo pipefail
          python -m pip install --quiet .
          python -c "
          from voight_kampff.scenario import load_pairs
          from voight_kampff.scoring import score_all
          from voight_kampff.report.build import build_report
          print('core imports clean with', len(load_pairs('scenarios/pairs')), 'pairs')
          "

      # A held-out pair copied into the public set stops being a control, and
      # the failure is silent -- everything still passes, the manifest still
      # verifies, and the split is simply gone.
      - name: No held-out scenario leaked into the public set
        run: |
          set -euo pipefail
          python -m pip install --quiet .
          python -c "
          import pathlib, sys
          from voight_kampff.heldout import find_leaks, load_manifest
          m = pathlib.Path('scenarios/heldout-manifest.json')
          if not m.exists():
              print('no held-out manifest; nothing to check'); sys.exit(0)
          leaks = find_leaks('scenarios/pairs', load_manifest(m))
          for leak in leaks:
              print('::error::held-out leak:', leak)
          sys.exit(1 if leaks else 0)
          "
          git ls-files scenarios/heldout/ | (! grep .) || {
            echo '::error::held-out pairs are tracked by git'; exit 1; }
          echo "ok: held-out set is intact"

      - name: No ignored artifacts slipped in
        run: |
          set -euo pipefail
          bad="$(git ls-files -i -c --exclude-standard || true)"
          if [ -n "$bad" ]; then
            echo "::error::tracked files match .gitignore"
            echo "$bad"
            exit 1
          fi
          echo "ok: nothing tracked that .gitignore excludes"

  checks:
    name: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # No evaluation code yet. Once pyproject.toml lands, this starts running
      # for real on all three platforms without further changes.
      - name: Lint and test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pyproject.toml ]; then
            echo "no pyproject.toml yet - nothing to lint or test"
            exit 0
          fi
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install ruff pytest
          ruff check .
          ruff format --check .
          pytest -q
